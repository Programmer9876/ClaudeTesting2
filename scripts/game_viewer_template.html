<title>Catan Game Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --ground: #eceee8;
  --panel: #f8f9f5;
  --ink: #1c2521;
  --muted: #5b6862;
  --line: #cfd6d0;
  --sea: #3b7396;
  --sea-edge: #2c5b78;
  --ours: #b07d12;
  --ours-soft: #f3e6c4;
  --now: #fffbe8;
  --wood: #4f8a46; --brick: #b95d3f; --sheep: #a9c970; --wheat: #e5c65b; --ore: #8e96a2; --desert: #d9c9a1;
  --p-RED: #cf3a2c; --p-BLUE: #2e6cd0; --p-ORANGE: #e8891b; --p-WHITE: #f5f5f0;
  --piece-edge: #1c2521;
  --token: #f7f1df; --token-ink: #1c2521; --token-hot: #b3261e;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #141a18; --panel: #1c2421; --ink: #e5ebe7; --muted: #9aa8a1; --line: #33413b;
    --sea: #1f4b66; --sea-edge: #163a50; --ours: #e0b04a; --ours-soft: #3a3120; --now: #2b2a1c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #141a18; --panel: #1c2421; --ink: #e5ebe7; --muted: #9aa8a1; --line: #33413b;
  --sea: #1f4b66; --sea-edge: #163a50; --ours: #e0b04a; --ours-soft: #3a3120; --now: #2b2a1c;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 40px; }
header { display: grid; gap: 6px; margin-bottom: 18px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 3.4vw, 34px); line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); max-width: 72ch; margin: 0; }
.result { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12.5px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); white-space: nowrap; }
.chip.win { border-color: var(--ours); background: var(--ours-soft); font-weight: 600; }
.dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--piece-edge); flex: none; }

.layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }

.boardbox { padding: 10px; display: grid; gap: 10px; }
.boardsvg { width: 100%; max-width: 100%; height: auto; display: block; aspect-ratio: 1 / 0.92; }
.status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding-inline: 4px; }
.status .now { font-weight: 700; }
.status .now .who { font-family: var(--display); font-size: 17px; }
.dice { display: inline-flex; gap: 5px; align-items: center; }
.die { width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--ink); background: var(--panel); display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 14px; }
.lastact { color: var(--muted); font-size: 14px; }

.controls { display: grid; gap: 8px; padding-inline: 4px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button, select { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--ground); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ours); outline-offset: 2px; }
button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); min-width: 78px; font-weight: 700; }
input[type=range] { width: 100%; accent-color: var(--ours); }
.pos { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

.side { display: grid; gap: 16px; }
.players { display: grid; }
.pl { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.pl:first-child { border-top: 0; }
.pl.turn { background: var(--now); }
.pl .name { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.pl .role { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-weight: 400; }
.tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--ours); color: #1c1606; font-weight: 600; }
.vp { grid-row: span 2; align-self: center; text-align: right; font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.vp small { display: block; font-family: var(--mono); font-size: 10.5px; font-weight: 400; color: var(--muted); margin-top: 3px; }
.pl .swatch { grid-row: span 2; width: 14px; border-radius: 4px; border: 1.5px solid var(--piece-edge); align-self: stretch; }
.hand { display: flex; flex-wrap: wrap; gap: 4px 5px; align-items: center; }
.rc { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 12px; padding: 1px 6px 1px 3px; border-radius: 5px; background: var(--ground); font-variant-numeric: tabular-nums; }
.rc i { width: 10px; height: 13px; border-radius: 2px; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
.rc.zero { opacity: .38; }
.rc .d { font-weight: 600; }
.rc .d.up { color: #2f7d32; } .rc .d.down { color: #b3261e; }
.meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px 12px; }
.meta b { color: var(--ink); font-weight: 700; }
.title-on { color: var(--ink); font-weight: 700; }

.chartbox { padding: 12px 14px 8px; }
.chartbox h2, .logbox h2 { font-family: var(--display); font-size: 16px; font-weight: 700; margin: 0 0 6px; }
.chartsvg { width: 100%; height: auto; display: block; }

.logbox { padding: 12px 0 0; }
.logbox h2 { padding-inline: 14px; }
.log { max-height: 360px; overflow-y: auto; border-top: 1px solid var(--line); font-size: 13.5px; }
.lr { display: grid; grid-template-columns: 3.6em 12px 1fr; gap: 8px; align-items: baseline; padding: 4px 14px; cursor: pointer; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.lr:hover { background: var(--ground); }
.lr.cur { background: var(--now); font-weight: 700; }
.lr.future { opacity: .45; }
.lr .t { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lr .dot { width: 10px; height: 10px; align-self: center; }
.lr.round { display: block; cursor: default; background: transparent; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 10px; }
.lr.round:hover { background: transparent; }

.notes { margin-top: 22px; display: grid; gap: 6px; color: var(--muted); font-size: 13.5px; max-width: 80ch; }
.notes b { color: var(--ink); }
kbd { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none !important; } }
@keyframes pulse { 0% { stroke-width: 0.16; opacity: 1; } 100% { stroke-width: 0.02; opacity: .2; } }
.pulse { animation: pulse 1.1s ease-out 1 both; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Replay</div>
    <h1 id="h1">Catan game replay</h1>
    <p class="sub" id="sub"></p>
    <div class="result" id="result"></div>
  </header>

  <div class="layout">
    <section class="card boardbox" aria-label="Board">
      <svg class="boardsvg" id="board" role="img" aria-label="Catan board"></svg>
      <div class="status">
        <div class="now" id="now"></div>
        <div class="dice" id="dice" aria-label="Last roll"></div>
      </div>
      <div class="lastact" id="lastact"></div>
      <div class="controls">
        <input type="range" id="scrub" min="0" max="1" value="0" aria-label="Position in the game">
        <div class="btnrow">
          <button id="bStart" title="Start (Home)">Start</button>
          <button id="bPrevTurn" title="Previous turn (Shift+Left)">&laquo; Turn</button>
          <button id="bBack" title="Previous action (Left)">&lsaquo; Back</button>
          <button id="bPlay" class="primary" title="Play or pause (Space)">Play</button>
          <button id="bFwd" title="Next action (Right)">Next &rsaquo;</button>
          <button id="bNextTurn" title="Next turn (Shift+Right)">Turn &raquo;</button>
          <button id="bEnd" title="End (End)">End</button>
          <select id="speed" aria-label="Playback speed">
            <option value="900">Slow</option>
            <option value="380" selected>Normal</option>
            <option value="120">Fast</option>
          </select>
          <span class="pos" id="pos"></span>
        </div>
      </div>
    </section>

    <aside class="side">
      <section class="card players" id="players" aria-label="Players"></section>
      <section class="card chartbox" aria-label="Victory points over the game">
        <h2>Race to <span id="target">10</span></h2>
        <svg class="chartsvg" id="chart" viewBox="0 0 400 150" role="img" aria-label="Victory points by round"></svg>
      </section>
      <section class="card logbox" aria-label="Game log">
        <h2>Game log</h2>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </div>

  <div class="notes" id="notes"></div>
</div>

<script>
const G = /*__GAME_DATA__*/null;
const RES = ["wood", "brick", "sheep", "wheat", "ore"];
const DEV = ["Knight", "VP", "Road Building", "Year of Plenty", "Monopoly"];
const NS = "http://www.w3.org/2000/svg";
const N = G.steps.length;
const colors = G.players.map(p => p.color);
const ours = G.players.findIndex(p => p.ours);
const pcol = c => `var(--p-${c})`;
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const name = s => G.players[s].ours ? `${colors[s]} (catanbot)` : `${colors[s]} (${G.players[s].who})`;

// ---- header ---------------------------------------------------------------
(function header() {
  const m = G.meta;
  document.getElementById("eyebrow").textContent =
    `${m.label ? m.label + " · " : ""}game ${m.game} · seed ${m.seed} · catanatron ${m.catanatron}`;
  const opp = [...new Set(G.players.filter(p => !p.ours).map(p => p.who))].join(", ");
  const nOpp = G.players.filter(p => !p.ours).length;
  document.getElementById("h1").textContent = `Our bot vs ${nOpp === 1 ? "" : nOpp + " × "}${opp}`;
  document.title = `Game ${m.game} Replay`;
  const w = colors.indexOf(m.winner);
  document.getElementById("sub").textContent =
    `Our bot plays ${colors[ours]}, seat ${ours + 1} of ${G.players.length}` +
    `${ours === G.players.length - 1 ? " (moves last)" : ours === 0 ? " (moves first)" : ""}. ` +
    `${name(w)} wins after ${m.rolls} turns. Every position below is the engine's own state, rebuilt from the game's action log.`;
  const r = document.getElementById("result");
  const order = m.vps.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]);
  for (const [v, i] of order) {
    const c = h("span", "chip" + (colors[i] === m.winner ? " win" : ""));
    const d = h("span", "dot"); d.style.background = pcol(colors[i]); c.appendChild(d);
    c.appendChild(document.createTextNode(`${colors[i]} ${v} VP${G.players[i].ours ? " · ours" : ""}${colors[i] === m.winner ? " · winner" : ""}`));
    r.appendChild(c);
  }
  document.getElementById("target").textContent = m.vps_to_win;
})();

// ---- board ----------------------------------------------------------------
const board = document.getElementById("board");
const S = 50; // px per unit circumradius
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
for (const t of G.tiles.concat(G.ports)) { minX = Math.min(minX, t.x); maxX = Math.max(maxX, t.x); minY = Math.min(minY, t.y); maxY = Math.max(maxY, t.y); }
const pad = 1.05;
board.setAttribute("viewBox", `${(minX - pad) * S} ${(minY - pad) * S} ${(maxX - minX + 2 * pad) * S} ${(maxY - minY + 2 * pad) * S}`);
const hexPts = (cx, cy, r) => [...Array(6)].map((_, i) => { const a = Math.PI / 180 * (60 * i - 90); return `${(cx + r * Math.cos(a)) * S},${(cy + r * Math.sin(a)) * S}`; }).join(" ");
const sea = el("g", {}, board);
// sea: one big hex behind everything
el("polygon", { points: hexPts((minX + maxX) / 2, (minY + maxY) / 2, (maxX - minX) / 2 + 1.35), fill: "var(--sea)", stroke: "var(--sea-edge)", "stroke-width": 3, transform: `rotate(30 ${(minX + maxX) / 2 * S} ${(minY + maxY) / 2 * S})` }, sea);
const gTiles = el("g", {}, board), gPorts = el("g", {}, board), gRob = el("g", {}, board), gRoads = el("g", {}, board), gBld = el("g", {}, board), gHi = el("g", {}, board);
const pips = n => 6 - Math.abs(7 - n);
const tileEls = {};
for (const t of G.tiles) {
  const g = el("g", {}, gTiles);
  el("polygon", { points: hexPts(t.x, t.y, 0.97), fill: `var(--${t.res ? t.res.toLowerCase() : "desert"})`, stroke: "var(--sea-edge)", "stroke-width": 1.2 }, g);
  if (t.num) {
    const hot = t.num === 6 || t.num === 8;
    el("circle", { cx: t.x * S, cy: t.y * S, r: 0.3 * S, fill: "var(--token)", stroke: "rgba(0,0,0,.25)", "stroke-width": 1 }, g);
    const tx = el("text", { x: t.x * S, y: t.y * S + 1, "text-anchor": "middle", "dominant-baseline": "middle", "font-family": "var(--display)", "font-weight": 700, "font-size": 0.27 * S, fill: hot ? "var(--token-hot)" : "var(--token-ink)" }, g);
    tx.textContent = t.num;
    const p = pips(t.num);
    for (let i = 0; i < p; i++) el("circle", { cx: (t.x + (i - (p - 1) / 2) * 0.065) * S, cy: (t.y + 0.17) * S, r: 0.022 * S, fill: hot ? "var(--token-hot)" : "var(--token-ink)" }, g);
  }
  tileEls[t.c.join(",")] = t;
}
for (const p of G.ports) {
  const [a, b] = p.nodes.map(n => G.nodes[n]);
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const px = mx + (p.x - mx) * 0.55, py = my + (p.y - my) * 0.55;
  for (const q of [a, b]) el("line", { x1: q[0] * S, y1: q[1] * S, x2: px * S, y2: py * S, stroke: "#e9dfc6", "stroke-width": 3, "stroke-linecap": "round", opacity: 0.85 }, gPorts);
  el("circle", { cx: px * S, cy: py * S, r: 0.27 * S, fill: p.res ? `var(--${p.res.toLowerCase()})` : "#f4efe2", stroke: "#1c2521", "stroke-width": 1.2 }, gPorts);
  const t = el("text", { x: px * S, y: py * S + 1, "text-anchor": "middle", "dominant-baseline": "middle", "font-family": "var(--mono)", "font-weight": 600, "font-size": 0.2 * S, fill: "#1c2521" }, gPorts);
  t.textContent = p.res ? "2:1" : "3:1";
}

function stateAt(k) {
  const bld = new Map(), roads = new Map();
  let rob = G.initial.robber;
  for (let i = 0; i < k; i++) {
    const s = G.steps[i];
    for (const [type, seat, where] of (s.add || [])) {
      if (type === "r") roads.set(where.join("-"), seat); else bld.set(where, { type, seat });
    }
    rob = s.rob;
  }
  return { bld, roads, rob };
}

function drawBoard(k) {
  const st = stateAt(k);
  gRoads.replaceChildren(); gBld.replaceChildren(); gRob.replaceChildren(); gHi.replaceChildren();
  const last = k > 0 ? G.steps[k - 1] : null;
  const fresh = new Set((last && last.add || []).map(x => JSON.stringify(x[2])));
  for (const [key, seat] of st.roads) {
    const [a, b] = key.split("-").map(n => G.nodes[n]);
    const shrink = 0.2;
    const x1 = a[0] + (b[0] - a[0]) * shrink, y1 = a[1] + (b[1] - a[1]) * shrink, x2 = b[0] + (a[0] - b[0]) * shrink, y2 = b[1] + (a[1] - b[1]) * shrink;
    el("line", { x1: x1 * S, y1: y1 * S, x2: x2 * S, y2: y2 * S, stroke: "var(--piece-edge)", "stroke-width": 9, "stroke-linecap": "round" }, gRoads);
    el("line", { x1: x1 * S, y1: y1 * S, x2: x2 * S, y2: y2 * S, stroke: pcol(colors[seat]), "stroke-width": 6, "stroke-linecap": "round" }, gRoads);
    if (fresh.has(JSON.stringify(key.split("-").map(Number)))) {
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      el("circle", { cx: mx * S, cy: my * S, r: 0.36 * S, fill: "none", stroke: "var(--ours)", class: "pulse" }, gHi).style.strokeWidth = "4";
    }
  }
  for (const [node, b] of st.bld) {
    const [x, y] = G.nodes[node];
    const c = pcol(colors[b.seat]);
    if (b.type === "s") {
      const s = 0.17;
      el("path", { d: `M${(x - s) * S},${(y + s * 0.9) * S} L${(x - s) * S},${(y - s * 0.2) * S} L${x * S},${(y - s * 1.15) * S} L${(x + s) * S},${(y - s * 0.2) * S} L${(x + s) * S},${(y + s * 0.9) * S} Z`, fill: c, stroke: "var(--piece-edge)", "stroke-width": 2, "stroke-linejoin": "round" }, gBld);
    } else {
      const s = 0.2;
      el("path", { d: `M${(x - s * 1.25) * S},${(y + s) * S} L${(x - s * 1.25) * S},${(y - s * 0.15) * S} L${(x - s * 0.5) * S},${(y - s * 0.15) * S} L${(x - s * 0.5) * S},${(y - s * 0.7) * S} L${(x + s * 0.1) * S},${(y - s * 1.3) * S} L${(x + s * 0.7) * S},${(y - s * 0.7) * S} L${(x + s * 0.7) * S},${(y - s * 0.15) * S} L${(x + s * 1.25) * S},${(y - s * 0.15) * S} L${(x + s * 1.25) * S},${(y + s) * S} Z`, fill: c, stroke: "var(--piece-edge)", "stroke-width": 2, "stroke-linejoin": "round" }, gBld);
    }
    if (fresh.has(JSON.stringify(node))) el("circle", { cx: x * S, cy: y * S, r: 0.4 * S, fill: "none", stroke: "var(--ours)", class: "pulse" }, gHi).style.strokeWidth = "4";
  }
  const rt = tileEls[st.rob.join(",")];
  if (rt) {
    const g = el("g", {}, gRob);
    el("polygon", { points: hexPts(rt.x, rt.y, 0.97), fill: "rgba(20,20,20,.38)" }, g);
    el("ellipse", { cx: (rt.x + 0.34) * S, cy: (rt.y + 0.05) * S, rx: 0.11 * S, ry: 0.19 * S, fill: "#2a2a2a", stroke: "#f2f2f2", "stroke-width": 1.2 }, g);
    el("circle", { cx: (rt.x + 0.34) * S, cy: (rt.y - 0.2) * S, r: 0.085 * S, fill: "#2a2a2a", stroke: "#f2f2f2", "stroke-width": 1.2 }, g);
  }
}

// ---- players --------------------------------------------------------------
const plBox = document.getElementById("players");
const plEls = G.players.map((p, i) => {
  const row = h("div", "pl");
  const sw = h("div", "swatch"); sw.style.background = pcol(p.color); row.appendChild(sw);
  const nm = h("div", "name");
  nm.appendChild(document.createTextNode(p.color[0] + p.color.slice(1).toLowerCase()));
  if (p.ours) nm.appendChild(h("span", "tag", "our bot"));
  nm.appendChild(h("span", "role", p.ours ? "catanbot" : p.who));
  row.appendChild(nm);
  const vp = h("div", "vp"); row.appendChild(vp);
  const hand = h("div", "hand"); row.appendChild(hand);
  const meta = h("div", "meta"); meta.style.gridColumn = "2 / 3"; row.appendChild(meta);
  plBox.appendChild(row);
  return { row, vp, hand, meta };
});

function drawPlayers(k) {
  const s = k > 0 ? G.steps[k - 1] : null;
  const P = s ? s.P : G.initial.P;
  const turnSeat = s ? s.a : 0;
  P.forEach((r, i) => {
    const [vp, pvp, hand, held, played, lrLen, lr, la] = r;
    const e = plEls[i];
    e.row.classList.toggle("turn", i === turnSeat);
    e.vp.replaceChildren(document.createTextNode(vp));
    const sm = h("small", null, vp !== pvp ? `${pvp} public` : "VP"); e.vp.appendChild(sm);
    e.hand.replaceChildren();
    const dl = s && s.dl && s.dl[i];
    hand.forEach((n, j) => {
      const c = h("span", "rc" + (n ? "" : " zero"));
      const sq = h("i"); sq.style.background = `var(--${RES[j]})`; c.appendChild(sq);
      c.appendChild(document.createTextNode(`${n}`));
      if (dl && dl[j]) { const d = h("span", "d " + (dl[j] > 0 ? "up" : "down"), (dl[j] > 0 ? "+" : "") + dl[j]); c.appendChild(d); }
      c.title = `${RES[j]}: ${n}`;
      e.hand.appendChild(c);
    });
    const tot = hand.reduce((a, b) => a + b, 0);
    e.meta.replaceChildren();
    const add = (html) => { const x = h("span"); x.innerHTML = html; e.meta.appendChild(x); };
    add(`<b>${tot}</b> cards`);
    const heldTxt = held.map((n, j) => n ? `${n} ${DEV[j]}` : null).filter(Boolean).join(", ");
    add(`dev held: <b>${heldTxt || "none"}</b>`);
    if (played[0]) add(`knights played <b>${played[0]}</b>`);
    add(`road <b>${lrLen}</b>`);
    if (lr) add(`<span class="title-on">Longest Road</span>`);
    if (la) add(`<span class="title-on">Largest Army</span>`);
  });
}

// ---- chart ----------------------------------------------------------------
const chart = document.getElementById("chart");
(function drawChart() {
  const W = 400, H = 150, L = 26, R = 8, T = 8, B = 22;
  const maxV = Math.max(G.meta.vps_to_win, ...G.meta.vps);
  const X = i => L + (W - L - R) * i / N, Y = v => T + (H - T - B) * (1 - v / maxV);
  const cs = getComputedStyle(document.documentElement);
  for (let v = 0; v <= maxV; v += 2) {
    el("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: "var(--line)", "stroke-width": v === G.meta.vps_to_win ? 1.4 : 0.7, "stroke-dasharray": v === G.meta.vps_to_win ? "4 3" : "" }, chart);
    const t = el("text", { x: L - 6, y: Y(v) + 3.5, "text-anchor": "end", "font-size": 10, "font-family": "var(--mono)", fill: "var(--muted)" }, chart); t.textContent = v;
  }
  if (G.meta.vps_to_win % 2) { const t = el("text", { x: L - 6, y: Y(G.meta.vps_to_win) + 3.5, "text-anchor": "end", "font-size": 10, "font-family": "var(--mono)", fill: "var(--muted)" }, chart); t.textContent = G.meta.vps_to_win; }
  // x ticks at every 20th turn (a turn starts with its roll)
  let lastR = 0;
  G.steps.forEach((s, i) => {
    if (s.r !== lastR && s.r % 20 === 0) {
      el("line", { x1: X(i), x2: X(i), y1: H - B, y2: H - B + 4, stroke: "var(--muted)", "stroke-width": 1 }, chart);
      const t = el("text", { x: X(i), y: H - 6, "text-anchor": "middle", "font-size": 10, "font-family": "var(--mono)", fill: "var(--muted)" }, chart); t.textContent = `turn ${s.r}`;
    }
    lastR = s.r;
  });
  G.players.forEach((p, seat) => {
    let d = `M${X(0)},${Y(G.initial.P[seat][0])}`;
    G.steps.forEach((s, i) => { d += ` L${X(i + 1)},${Y(s.P[seat][0])}`; });
    el("path", { d, fill: "none", stroke: "var(--piece-edge)", "stroke-width": p.ours ? 4.2 : 3, "stroke-linejoin": "round", opacity: p.color === "WHITE" ? 0.9 : 0 }, chart);
    el("path", { d, fill: "none", stroke: pcol(p.color), "stroke-width": p.ours ? 2.8 : 1.7, "stroke-linejoin": "round" }, chart);
  });
  el("line", { id: "cursor", x1: X(0), x2: X(0), y1: T, y2: H - B, stroke: "var(--ink)", "stroke-width": 1, opacity: 0.6 }, chart);
  chart._X = X;
})();

// ---- log ------------------------------------------------------------------
const logBox = document.getElementById("log");
const logRows = [];
(function buildLog() {
  let lastR = -1;
  G.steps.forEach((s, i) => {
    if (s.r !== lastR) {
      const label = s.r === 0 ? "Setup: two settlements and roads each" : `Turn ${s.r} · ${colors[s.a]}`;
      logBox.appendChild(h("div", "lr round", label));
      lastR = s.r;
    }
    const row = h("div", "lr");
    row.appendChild(h("span", "t", `#${i + 1}`));
    const d = h("span", "dot"); d.style.background = pcol(colors[s.a]); row.appendChild(d);
    row.appendChild(h("span", null, `${colors[s.a][0] + colors[s.a].slice(1).toLowerCase()}${G.players[s.a].ours ? " (ours)" : ""} ${s.x}`));
    row.addEventListener("click", () => go(i + 1));
    logBox.appendChild(row);
    logRows.push(row);
  });
})();

// ---- notes ----------------------------------------------------------------
(function notes() {
  const n = document.getElementById("notes");
  const lines = [
    `<b>What you see.</b> Every player's hand and development cards are shown, because the log records the full state. At a real table (and on Colonist) you would see only card counts and would have to track the rest.`,
    `<b>Trades.</b> This test was played with player-to-player trading off, as Catanatron's bots cannot trade with each other. Only bank and port trades happen.`,
    `<b>Keys.</b> <kbd>←</kbd> <kbd>→</kbd> step one action, <kbd>Shift</kbd> + arrows jump a turn, <kbd>Space</kbd> plays or pauses. Click any line of the log to jump there.`,
  ];
  for (const l of lines) { const p = h("p"); p.style.margin = "0"; p.innerHTML = l; n.appendChild(p); }
})();

// ---- navigation -----------------------------------------------------------
const scrub = document.getElementById("scrub");
scrub.max = N;
let k = N, timer = null;
function turnStarts() { const out = [0]; G.steps.forEach((s, i) => { if (s.k === "ROLL") out.push(i); }); out.push(N); return out; }
const starts = turnStarts();
function go(n) {
  k = Math.max(0, Math.min(N, n));
  scrub.value = k;
  drawBoard(k); drawPlayers(k);
  const s = k > 0 ? G.steps[k - 1] : null;
  const now = document.getElementById("now");
  now.replaceChildren();
  if (!s) now.textContent = "Before the first placement";
  else {
    const d = h("span", "dot"); d.style.display = "inline-block"; d.style.marginRight = "6px"; d.style.background = pcol(colors[s.a]); now.appendChild(d);
    now.appendChild(h("span", "who", `${colors[s.a][0] + colors[s.a].slice(1).toLowerCase()}${G.players[s.a].ours ? " (our bot)" : ""}`));
    now.appendChild(document.createTextNode(s.r ? ` · turn ${s.r}` : " · setup"));
  }
  document.getElementById("lastact").textContent = s ? s.x[0].toUpperCase() + s.x.slice(1) + (k === N ? `. ${G.meta.winner} wins.` : "") : "Press Play to watch the game from the first placement.";
  // dice of the current turn's roll
  const dice = document.getElementById("dice"); dice.replaceChildren();
  for (let i = k - 1; i >= 0; i--) {
    if (G.steps[i].k === "ROLL") { for (const v of G.steps[i].d) dice.appendChild(h("span", "die", v)); break; }
    if (G.steps[i].k === "END_TURN") break;
  }
  document.getElementById("pos").textContent = `action ${k} / ${N}`;
  const cur = chart.querySelector("#cursor"); cur.setAttribute("x1", chart._X(k)); cur.setAttribute("x2", chart._X(k));
  logRows.forEach((r, i) => { r.classList.toggle("cur", i === k - 1); r.classList.toggle("future", i >= k); });
  const row = logRows[k - 1];
  if (row) {
    const top = row.offsetTop - logBox.offsetTop, bottom = top + row.offsetHeight;
    if (top < logBox.scrollTop + 30 || bottom > logBox.scrollTop + logBox.clientHeight - 30) logBox.scrollTop = top - logBox.clientHeight / 2;
  }
}
function stop() { if (timer) { clearInterval(timer); timer = null; } document.getElementById("bPlay").textContent = "Play"; }
function play() {
  if (timer) return stop();
  if (k >= N) go(0);
  document.getElementById("bPlay").textContent = "Pause";
  const tick = () => { if (k >= N) return stop(); go(k + 1); };
  timer = setInterval(tick, +document.getElementById("speed").value);
}
const prevTurn = () => { const t = starts.filter(x => x < k - 1); go(t.length ? t[t.length - 1] : 0); };
const nextTurn = () => { const t = starts.find(x => x > k - 1); go(t === undefined ? N : Math.max(t, k + 1)); };
document.getElementById("bStart").onclick = () => { stop(); go(0); };
document.getElementById("bEnd").onclick = () => { stop(); go(N); };
document.getElementById("bBack").onclick = () => { stop(); go(k - 1); };
document.getElementById("bFwd").onclick = () => { stop(); go(k + 1); };
document.getElementById("bPrevTurn").onclick = () => { stop(); prevTurn(); };
document.getElementById("bNextTurn").onclick = () => { stop(); nextTurn(); };
document.getElementById("bPlay").onclick = play;
document.getElementById("speed").onchange = () => { if (timer) { stop(); play(); } };
scrub.oninput = () => { stop(); go(+scrub.value); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.key === "ArrowRight") { e.preventDefault(); stop(); e.shiftKey ? nextTurn() : go(k + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); stop(); e.shiftKey ? prevTurn() : go(k - 1); }
  else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); play(); }
  else if (e.key === "Home") { stop(); go(0); }
  else if (e.key === "End") { stop(); go(N); }
});
go(N);
</script>
